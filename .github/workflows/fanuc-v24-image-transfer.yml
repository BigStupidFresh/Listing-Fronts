name: Reconstruct verified corrected stock image
on:
  push:
    branches: ['assets/fanuc-v24-transfer-20261022']
    paths: ['Transfer/fanuc-v24/**', '.github/workflows/fanuc-v24-image-transfer.yml']
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: assets/fanuc-v24-transfer-20261022
      - name: Reconstruct and verify exact image
        run: python3 Transfer/fanuc-v24/reconstruct.py
